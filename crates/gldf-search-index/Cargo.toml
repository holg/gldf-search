[package]
name = "gldf-search-index"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Search index for gldf-search. v0 is a linear-scan reference implementation; fst+roaring index lands in v1."

[dependencies]
