# crates.io publish name = `gldf-search` so `cargo install gldf-search`
# lands the index/search CLI binary. The crate directory is still
# `gldf-search-cli` to mirror the other workspace members (-schema,
# -gldf, -index, -leptos, -server); only the published package name
# differs. Internal references inside the workspace's `[patch]` /
# `[workspace.dependencies]` keep using the `gldf-search-cli` slot —
# nothing depends on the cli crate as a library anyway.
[package]
name = "gldf-search"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Command-line tools for the gldf-search index: corpus extraction, family-fold dedup, search, sizing reports."
keywords = ["lighting", "gldf", "photometry", "cli", "search"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "gldf-search"
path = "src/main.rs"

[dependencies]
gldf-rs.workspace = true
gldf-search-schema.workspace = true
gldf-search-gldf.workspace = true
gldf-search-index.workspace = true
smallvec.workspace = true
compact_str.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
rand.workspace = true
blake3.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
# Parallel corpus extraction for the `build-index` subcommand. The
# server intentionally stays single-threaded on production (one
# core); local index builds happily use every core available and
# rsync the resulting cache to the server.
rayon = "1.10"
# Repackage benchmark — read existing GLDF (deflate) and re-archive
# with Zstd (ZIP method 93) to measure compression headroom on the
# corpus. Local-only; the runtime path uses gldf-rs's zip dep.
zip = { version = "2", default-features = false, features = ["deflate", "zstd"] }
