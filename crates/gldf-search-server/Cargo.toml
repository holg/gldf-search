[package]
name = "gldf-search-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Axum + Leptos SSR server for gldf-search. Holds an in-memory index and exposes /api/* endpoints."
keywords = ["lighting", "gldf", "axum", "search", "server"]
categories = ["web-programming::http-server", "command-line-utilities"]

[[bin]]
name = "gldf-search-server"
path = "src/main.rs"

[dependencies]
gldf-rs.workspace = true
gldf-search-schema.workspace = true
gldf-search-gldf.workspace = true
gldf-search-index.workspace = true
gldf-search-leptos = { workspace = true, features = ["ssr"] }

serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true

axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
urlencoding.workspace = true

leptos = { workspace = true, features = ["ssr"] }
leptos_axum = { workspace = true, features = ["default"] }
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr"] }

# cargo-leptos metadata is set at the **workspace root** (multi-crate
# project: bin and lib live in different crates). See the workspace
# Cargo.toml's `[[workspace.metadata.leptos]]` array.
